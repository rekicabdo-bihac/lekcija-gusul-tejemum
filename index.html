<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gusulski i tejemumski šarti</title><style>*{box-sizing:border-box}body{margin:0;background:#081f1b;color:#fff;font:16px Arial,sans-serif}header{background:linear-gradient(130deg,#07523f,#197e62);text-align:center;padding:17px 9px;border-bottom:3px solid #d8b65d}h1{font-size:24px;color:#ffe7a0;margin:0 0 6px}h2{font-size:21px;color:#ffe7a0}main{max-width:750px;margin:auto;padding:10px}.tabs,.stages{display:grid;gap:7px;margin:10px 0}.tabs{grid-template-columns:repeat(2,1fr)}.stages{grid-template-columns:repeat(2,1fr)}button{background:#195d48;border:1px solid #c5a259;border-radius:12px;padding:12px 8px;color:white;font-size:14px;font-weight:700;touch-action:manipulation;cursor:pointer}button.active{background:#dfbb60;color:#14221a}button:disabled{opacity:.55}.panel,.card{background:#12392e;border:1px solid #7c9e7c;border-radius:14px;padding:14px;margin:10px 0}.card{background:#1c503f}p{line-height:1.55}.answer{width:100%;text-align:left;margin:6px 0;min-height:46px}.right{background:#168044!important}.wrong{background:#a93443!important}.selected{background:#b88b29!important;color:#111}.matched{background:#168044!important;opacity:.65}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pairs button{width:100%;min-height:65px;margin:4px 0;font-size:12px}.bar{background:#35564a;height:9px;border-radius:8px;overflow:hidden}.bar>div{background:#e6c46a;width:0;height:100%;transition:width .25s}#score,#feedback{text-align:center;font-weight:700;margin:10px}#score{color:#ffe29a}#feedback{min-height:22px}.row{display:flex;gap:8px}.row button{flex:1}.small{color:#d4e6d9;font-size:13px}.word{font-weight:700;color:#ffe3a0;font-size:18px}footer{text-align:center;color:#e5d29c;padding:20px}</style></head><body><header><h1>🕌 GUSULSKI I TEJEMUMSKI ŠARTI</h1><div>Dvije odvojene interaktivne lekcije</div><small>Pripremio Abdo ef. Rekić</small></header><main><div class="tabs" id="tabs"></div><div class="stages" id="stages"></div><div id="score">Bodovi: 0</div><div class="bar"><div id="bar"></div></div><section class="panel" id="content"></section><div id="feedback" aria-live="polite"></div></main><footer>Pripremio Abdo ef. Rekić</footer><script>
'use strict';
const LESSONS=[{name:'GUSULSKI ŠARTI',intro:'Gusul je obavezno vjersko kupanje u određenim stanjima. Gusul ima tri šarta: isprati usta i grlo, isprati nos i oprati cijelo tijelo tako da nigdje ne ostane suho.',parts:[['Gargara','Isprati usta i grlo.'],['Istinšak','Isprati nos.'],['Gasli vudžud','Oprati cijelo tijelo, da nigdje ne ostane suho.']],order:['Proučiti Euzu, Bismillu i zanijetiti','Oprati vidljivu nečistoću s tijela','Oprati usta i grlo','Oprati nos','Oprati cijelo tijelo'],questions:[
['Šta je gusul?','Obavezno vjersko kupanje','Dobrovoljni namaz','Zamjensko čišćenje zemljom','Pranje samo šaka'],['Koliko gusulskih šarta ima?','Tri','Dva','Četiri','Pet'],['Koja radnja je gargara?','Isprati usta i grlo','Isprati samo nos','Potrati lice zemljom','Oprati samo ruke'],['Koja radnja je istinšak?','Isprati nos','Isprati usta i grlo','Oprati samo stopala','Potrati ruke zemljom'],['Šta znači gasli vudžud?','Oprati cijelo tijelo','Oprati samo glavu','Isprati samo nos','Oprati samo lice'],['Koliko puta se prema lekciji ispiru usta i grlo?','Tri puta','Jednom','Dva puta','Četiri puta'],['Koliko puta se prema lekciji ispire nos?','Tri puta','Jednom','Dva puta','Pet puta'],['Koji je prvi gusulski šart?','Gargara','Istinšak','Gasli vudžud','Mesh'],['Koji je drugi gusulski šart?','Istinšak','Gargara','Gasli vudžud','Nijjet'],['Koji je treći gusulski šart?','Gasli vudžud','Gargara','Istinšak','Euzu'],['Šta ne smije ostati suho pri gusulu?','Nijedan dio tijela koji se mora oprati','Samo kosa','Samo stopala','Samo šake'],['Šta se preporučuje proučiti prije gusula?','Euzu i Bismillu','Ettehijjatu i selam','Salavate i selam','Samo završni selam'],['Šta je sunnet učiniti prije gusula?','Zanijetiti gusul','Učiti kunut-dovu','Predati selam','Obaviti tejemum bez potrebe'],['Šta se prema lekciji prvo uklanja s tijela?','Vidljiva nečistoća','Samo prašina s odjeće','Samo voda s ruku','Samo miris sapuna'],['Šta je preporučeno prati pri gusulu tri puta?','Tijelo','Samo odjeću','Samo peškir','Samo obuću'],['Kako se prema lekciji preporučuje početi pranje tijela?','Od glave, pa desne i lijeve strane','Od lijeve noge, pa glave','Od desne noge, pa odjeće','Od ruku, pa obuće'],['Šta je pokuđeno pri gusulu?','Pretjerano rasipanje vode','Pranje cijelog tijela','Ispiranje usta','Ispiranje nosa'],['Šta je pokuđeno tokom kupanja bez potrebe?','Tražiti pomoć drugog','Samostalno se okupati','Oprati cijelo tijelo','Isprati nos'],['Kada je gusul obavezan?','U stanju džunupluka','Prije svakog obroka','Nakon svakog izlaska iz kuće','Prije svakog spavanja'],['Šta razlikuje gusul od običnog tuširanja?','Izvršavanje propisanih obaveznih radnji gusula','Upotreba posebne boje sapuna','Pranje samo kose','Obavezno korištenje peškira'],['Koji šart se odnosi na usta?','Gargara','Istinšak','Gasli vudžud','Mesh'],['Koji šart se odnosi na nos?','Istinšak','Gargara','Gasli vudžud','Kijam'],['Koji šart obuhvata cijelo tijelo?','Gasli vudžud','Gargara','Istinšak','Nijjet'],['Koja kombinacija navodi sva tri gusulska šarta?','Gargara, istinšak i gasli vudžud','Gargara, mesh i selam','Istinšak, kijam i ruku','Gasli vudžud, selam i sedžda'],['Šta je cilj gusula?','Postići propisanu vjersku čistoću','Zamijeniti svaki namaz','Zamijeniti svaki post','Oprati samo odjeću']]},
{name:'TEJEMUMSKI ŠARTI',intro:'Tejemum je simbolično čišćenje čistom zemljom ili predmetom od zemlje kada nema vode ili se voda ne može koristiti. Tejemum ima tri šarta: nijjet, potiranje lica i potiranje ruku do iza lakata.',parts:[['Nijjet','Srcem odlučiti obaviti tejemum.'],['Potiranje lica','Dotaknuti čistu zemlju dlanovima i potrati cijelo lice.'],['Potiranje ruku','Ponovo dotaknuti čistu zemlju i potrati obje ruke do iza lakata.']],order:['Zanijetiti tejemum','Dotaknuti dlanovima čistu zemlju','Potrati cijelo lice','Ponovo dotaknuti čistu zemlju','Potrati desnu i lijevu ruku do iza lakata'],questions:[
['Šta je tejemum?','Simbolično čišćenje čistom zemljom ili zemljinom tvari','Kupanje cijelog tijela vodom','Pranje samo stopala vodom','Učenje dove poslije namaza'],['Koliko tejemumskih šarta ima?','Tri','Dva','Četiri','Pet'],['Koji je prvi tejemumski šart?','Nijjet','Potiranje lica','Potiranje ruku','Pranje stopala'],['Koji je drugi tejemumski šart?','Potiranje lica','Nijjet','Potiranje ruku','Pranje stopala'],['Koji je treći tejemumski šart?','Potiranje ruku do iza lakata','Potiranje lica','Nijjet','Pranje stopala'],['Kada je dozvoljen tejemum?','Kada nema vode ili se ne smije koristiti','Kad imamo dovoljno vode i možemo je koristiti','Samo kada pada kiša','Samo nakon kupanja'],['Čime se obavlja tejemum?','Čistom zemljom ili prikladnom zemljinom tvari','Prljavom vodom','Mirisnim uljem','Vlažnom odjećom'],['Šta znači nijjet pri tejemumu?','Srcem odlučiti obaviti tejemum','Oprati cijelo tijelo','Izgovoriti selam','Potrati stopala'],['Šta prvo potiremo nakon dodira sa zemljom?','Lice','Stopala','Kosu','Uši'],['Šta potiremo nakon drugog dodira sa zemljom?','Obje ruke do iza lakata','Samo stopala','Samo kosu','Samo vrat'],['Koliko puta dlanovima dodirujemo zemlju prema lekciji?','Dva puta','Jednom','Tri puta','Četiri puta'],['Šta radimo prije prvog dodira sa zemljom?','Zanijetimo tejemum','Predajemo selam','Učimo Ettehijjatu','Učimo salavate'],['Šta je dozvoljeno ako nam je voda potrebnija za piće?','Obaviti tejemum','Ostaviti namaz bez čišćenja','Obaviti gusul bez vode','Potrati samo stopala'],['Koji je primjer razloga da se voda ne koristi?','Bolest zbog koje bi voda štetila','Voda je blizu i sigurna','Imamo dovoljno tople vode','Voda je čista i dostupna'],['Šta može pokvariti tejemum?','Ono što kvari abdest','Učenje Kur’ana','Izgovaranje selama','Učenje dove'],['Šta još prekida valjanost tejemuma obavljenog zbog nedostatka vode?','Mogućnost upotrebe vode','Nastupanje noći','Promjena odjeće','Ulazak u džamiju'],['Do kojeg dijela ruku ih potiremo?','Do iza lakata','Samo do prstiju','Samo do zapešća','Samo do ramena'],['Koje dijelove potiremo u tejemumu?','Lice i ruke do iza lakata','Lice i stopala','Glavu i stopala','Uši i vrat'],['Šta se radi između potiranja lica i ruku?','Ponovo se dlanovima dotakne čista zemlja','Ponovo se opere cijelo tijelo','Preda se selam','Obuje se obuća'],['Čime se tejemum razlikuje od gusula?','Tejemum se obavlja čistom zemljom, a gusul vodom','Tejemum se uvijek obavlja vodom','Gusul se uvijek obavlja zemljom','Oba se obavljaju samo peškirom'],['Kada tejemum zamjenjuje abdest?','Kada postoji opravdan razlog za nekorištenje vode','Uvijek kada nam se ne da uzeti abdest','Samo poslije namaza','Samo kada smo već pod abdestom'],['Kada tejemum može zamijeniti gusul?','Kada je gusul potreban, a voda nedostupna ili štetna','Kada je voda dostupna i ne šteti','Samo nakon učenja dove','Samo prije jela'],['Koji je pravilan redoslijed tejemumskih šarta?','Nijjet, lice, ruke','Lice, ruke, nijjet','Ruke, nijjet, lice','Ruke, lice, nijjet'],['Koja površina odgovara za tejemum?','Čista zemlja','Nečista zemlja','Prljava voda','Masna tkanina'],['Šta treba učiniti kad voda postane dostupna i može se koristiti?','Za naredno čišćenje uzeti abdest ili gusul prema potrebi','Nastaviti tejemum bez razloga','Potrati samo obuću','Izostaviti čišćenje']]}];
const STAGES=['NAUČI','SPOJI','SLOŽI REDOM','ŠTA NEDOSTAJE?','PREPOZNAJ PO ZNAČENJU','BRZI IZAZOV','ZAVRŠNI ISPIT'];let lesson=0,stage=0,score=0,idx=0,learnIdx=0,selected=null,matched=new Set(),left=[],right=[],order=[],remaining=[],tasks=[],locked=false,timer;const E=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function sound(ok){try{let C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(ok?650:280,a.currentTime);o.frequency.linearRampToValueAtTime(ok?900:140,a.currentTime+.17);g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.26);o.onended=()=>a.close()}catch(e){}}function feedback(ok){score+=ok?10:-3;E('score').textContent='Bodovi: '+score;E('feedback').textContent=ok?'TAČNO! +10':'NETAČNO! −3';E('feedback').style.color=ok?'#90ffae':'#ffaaaa';sound(ok)}function prog(a,b){E('bar').style.width=(100*a/b)+'%'}function menu(){E('tabs').innerHTML=LESSONS.map((d,i)=>`<button class="${lesson===i?'active':''}" onclick="choose(${i})">${d.name}</button>`).join('');E('stages').innerHTML=STAGES.map((d,i)=>`<button class="${stage===i?'active':''}" onclick="go(${i})">${i+1}. ${d}</button>`).join('')}function choose(i){lesson=i;score=0;E('score').textContent='Bodovi: 0';go(0)}function go(i){clearTimeout(timer);stage=i;idx=0;learnIdx=0;selected=null;matched=new Set();locked=false;E('feedback').textContent='';menu();if(i===0)learn();else if(i===1)startMatch();else if(i===2)startOrder();else startQuiz()}
function learn(){let d=LESSONS[lesson],total=d.parts.length+2;prog(learnIdx+1,total);let html=`<h2>📖 NAUČI – ${d.name}</h2><p class="small">Kartica ${learnIdx+1} od ${total}</p>`;if(learnIdx===0)html+=`<div class="card"><p>${esc(d.intro)}</p></div>`;else if(learnIdx<=d.parts.length){let p=d.parts[learnIdx-1];html+=`<div class="card"><p class="word">${esc(p[0])}</p><p>${esc(p[1])}</p></div>`}else html+=`<div class="card"><h3>Pravilan redoslijed</h3>${d.order.map((x,i)=>`<p>${i+1}. ${esc(x)}</p>`).join('')}</div>`;html+=`<div class="row"><button onclick="learnIdx=Math.max(0,learnIdx-1);learn()">← Nazad</button><button onclick="if(learnIdx<${total-1}){learnIdx++;learn()}else go(1)">Dalje →</button></div>`;E('content').innerHTML=html}
function startMatch(){let p=LESSONS[lesson].parts.map((x,i)=>({id:i,a:x[0],b:x[1]}));left=shuffle(p);right=shuffle(p);matched=new Set();selected=null;drawMatch()}function drawMatch(){prog(matched.size,left.length);let h='<h2>🧩 SPOJI</h2><p>Spoji naziv i objašnjenje.</p><div class="pairs"><div>';left.forEach(p=>h+=`<button class="${matched.has(p.id)?'matched':selected===p.id?'selected':''}" ${matched.has(p.id)?'disabled':''} onclick="selectLeft(${p.id})">${esc(p.a)}</button>`);h+='</div><div>';right.forEach(p=>h+=`<button class="${matched.has(p.id)?'matched':''}" ${matched.has(p.id)?'disabled':''} onclick="selectRight(${p.id})">${esc(p.b)}</button>`);h+='</div></div>';if(matched.size===left.length)h+='<h3>Bravo! Svi parovi su spojeni.</h3><button onclick="go(2)">SLOŽI REDOM →</button>';E('content').innerHTML=h}function selectLeft(i){selected=i;drawMatch()}function selectRight(i){if(selected===null)return;let ok=i===selected;if(ok)matched.add(i);feedback(ok);selected=null;drawMatch()}
function startOrder(){order=LESSONS[lesson].order.map((t,i)=>({id:i,t}));remaining=shuffle(order);idx=0;drawOrder()}function drawOrder(){prog(idx,order.length);let h='<h2>🔢 SLOŽI REDOM</h2><p>Dodirni radnje pravilnim redoslijedom.</p><div class="card">'+order.slice(0,idx).map(x=>`<p>✓ ${esc(x.t)}</p>`).join('')+'</div>';remaining.forEach(x=>h+=`<button class="answer" onclick="pickOrder(${x.id})">${esc(x.t)}</button>`);if(idx===order.length)h+='<h3>Odlično!</h3><button onclick="go(3)">ŠTA NEDOSTAJE? →</button>';E('content').innerHTML=h}function pickOrder(i){let ok=i===idx;feedback(ok);if(ok){remaining=remaining.filter(x=>x.id!==i);idx++}drawOrder()}
function makeTasks(){let d=LESSONS[lesson],out=[];const add=(q,answer,wrong)=>{let options=shuffle([...new Set([answer,...wrong.filter(x=>x!==answer)])]);if(options.length>=4)out.push({q,answer,options:options.slice(0,4)})};d.questions.forEach(x=>add(x[0],x[1],x.slice(2)));let names=d.parts.map(x=>x[0]),meanings=d.parts.map(x=>x[1]);d.parts.forEach((p,i)=>{let distractors=shuffle(meanings.filter((_,j)=>j!==i));if(distractors.length>=2)add('Šta znači: '+p[0]+'?',p[1],[...distractors,'Nijedna od navedenih radnji']);let n=shuffle(names.filter((_,j)=>j!==i));add('Koji šart znači: '+p[1]+'?',p[0],[...n,'Nijedna od navedenih radnji'])});return out}
function startQuiz(){let all=makeTasks(),d=LESSONS[lesson];if(stage===3){tasks=d.order.slice(1).map((x,i)=>{let other=shuffle(d.order.filter(z=>z!==x)).slice(0,3);return {q:'Šta nedostaje? '+d.order.slice(0,i+1).join(' → ')+' → ❓',answer:x,options:shuffle([x,...other])}})}else if(stage===4)tasks=shuffle(all.filter(x=>x.q.startsWith('Šta znači:')||x.q.startsWith('Koji šart')));else if(stage===5)tasks=shuffle(all).slice(0,12);else tasks=shuffle(all.filter(x=>d.questions.some(y=>y[0]===x.q))).slice(0,25);idx=0;drawQuiz()}
function drawQuiz(){if(idx>=tasks.length){prog(1,1);E('content').innerHTML=`<h2>🏆 ČESTITAMO!</h2><div class="card"><p>${LESSONS[lesson].name}</p><p>Završena etapa: ${STAGES[stage]}</p><p>Bodovi: ${score}</p></div><button onclick="go(${stage===6?0:stage+1})">${stage===6?'PONOVI LEKCIJU ↻':'SLJEDEĆA ETAPA →'}</button>`;return}let t=tasks[idx];prog(idx,tasks.length);E('content').innerHTML=`<h2>${STAGES[stage]}</h2><p class="small">Zadatak ${idx+1} / ${tasks.length}</p><div class="card"><h3>${esc(t.q)}</h3></div>`+t.options.map((a,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})">${esc(a)}</button>`).join('')}
function answer(i){if(locked)return;locked=true;let t=tasks[idx],ok=t.options[i]===t.answer;feedback(ok);t.options.forEach((a,j)=>{let b=E('ans'+j);b.disabled=true;if(a===t.answer)b.classList.add('right');else if(i===j)b.classList.add('wrong')});timer=setTimeout(()=>{idx++;locked=false;E('feedback').textContent='';drawQuiz()},950)}choose(0);
</script></body></html>
